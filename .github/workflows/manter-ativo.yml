# Faz uma consulta simples ao Supabase a cada 2 dias para o projeto gratuito
# não ser pausado por inatividade. Não precisa configurar nada: o endereço e a
# chave pública são lidos do próprio config.js do site.
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 12 */2 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar produtos
        env:
          CONFIG_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/config.js
        run: |
          # baixa só o config.js do repositório (sem ações de terceiros)
          curl -fsS --retry 3 "$CONFIG_URL" -o config.js
          URL=$(sed -nE "s/.*supabaseUrl:[[:space:]]*'([^']+)'.*/\1/p" config.js | head -1)
          KEY=$(sed -nE "s/.*supabaseKey:[[:space:]]*'([^']+)'.*/\1/p" config.js | head -1)
          # aceita a URL com ou sem / ou /rest/v1 no final
          URL=$(printf '%s' "$URL" | tr -d '[:space:]' | sed -E 's#/+$##; s#/(rest|auth|storage)/v1$##')
          KEY=$(printf '%s' "$KEY" | tr -d '[:space:]')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Não encontrei supabaseUrl/supabaseKey no config.js"; exit 1
          fi
          echo "Consultando $URL ..."
          curl -fsS --retry 3 --retry-delay 10 "$URL/rest/v1/products?select=id&limit=1" -H "apikey: $KEY" -o /dev/null
          echo "Supabase ativo ✔"
