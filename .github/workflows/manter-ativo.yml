# Faz uma consulta simples ao Supabase a cada 2 dias para o projeto gratuito
# não ser pausado por inatividade. Configure os "secrets" SUPABASE_URL e SUPABASE_KEY
# em: GitHub → Settings → Secrets and variables → Actions.
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 12 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar produtos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/products?select=id&limit=1" -H "apikey: $SUPABASE_KEY" > /dev/null
          echo "Supabase ativo"
